server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Using H2 In-Memory Database for Render (No localhost connection needed)
  datasource:
    url: jdbc:h2:mem:evandata;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    # Using environment variables so your password is safe
    username: ${MAIL_USERNAME:obayecha@gmail.com}
    password: ${MAIL_PASSWORD:objppqedrajxfdec}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ddu-evangelical-secret-key-2026
  expiration: 86400000

file:
